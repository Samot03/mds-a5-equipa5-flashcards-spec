<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards de Estudo</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="contentor">
    <h1>Flashcards de Estudo</h1>

    <div id="progresso" class="progresso" hidden>
      <p id="progresso-texto" class="progresso-texto"></p>
      <div id="progresso-barra" class="progresso-barra" role="progressbar"
           aria-label="Progresso" aria-valuemin="0">
        <div id="progresso-preenchimento" class="progresso-preenchimento"></div>
      </div>
    </div>

    <section id="ecra-estudo" aria-label="Estudo" hidden>
      <button type="button" id="cartao" class="cartao">
        <span class="cartao-interior">
          <span class="face face-frente">
            <span id="frente-marca" class="frente-marca"></span>
          </span>
          <span class="face face-verso">
            <span><strong>País:</strong> <span id="verso-pais"></span></span>
            <span><strong>Fundação:</strong> <span id="verso-ano"></span></span>
            <span><strong>Fundador(es):</strong> <span id="verso-fundador"></span></span>
          </span>
        </span>
      </button>
      <p id="anuncio-face" class="so-leitor" aria-live="polite"></p>
      <p id="marcacao-atual" class="marcacao-atual" hidden></p>

      <div class="acoes-marcar">
        <button type="button" id="botao-sei" class="botao botao-sei">Sei</button>
        <button type="button" id="botao-rever" class="botao botao-rever">A rever</button>
      </div>
      <div class="acoes-navegar">
        <button type="button" id="botao-anterior" class="botao botao-neutro">Anterior</button>
      </div>
    </section>

    <section id="ecra-resumo" aria-label="Resumo" hidden>
      <h2 id="titulo-resumo" tabindex="-1">Resumo da sessão</h2>
      <div class="contagens">
        <p class="contagem contagem-sei">Sei: <strong id="contagem-sei"></strong></p>
        <p class="contagem contagem-rever">A rever: <strong id="contagem-rever"></strong></p>
      </div>
      <h3>Cartões a rever</h3>
      <ul id="lista-rever" class="lista-rever"></ul>
      <p id="sem-rever" hidden>Não há cartões a rever.</p>
      <button type="button" id="botao-recomecar" class="botao botao-neutro botao-largo">Recomeçar</button>
    </section>

    <section id="ecra-erro" aria-label="Erro" hidden>
      <p role="alert">Não foi possível carregar o baralho.</p>
    </section>
  </main>
</body>
</html>
